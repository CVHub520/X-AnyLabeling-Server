model_id: locateanything
display_name: "LocateAnything"
batch_processing_mode: "text_prompt"

params:
  model_path: "nvidia/LocateAnything-3B"
  # cuda | cuda:0 | cuda:1 | cpu
  device: "cuda"
  # bfloat16 | float16 | float32
  dtype: "bfloat16"
  # detection | grounding | pointing | text_detection
  task: "detection"
  max_image_size: 1024
  max_new_tokens: 512
  # fast | slow | hybrid
  generation_mode: "hybrid"
  temperature: 0.7
  verbose: false

widgets:
  - name: remote_task_select_combobox
    value: null
  - name: button_send
    value: null
  - name: edit_text
    value: null
  - name: toggle_preserve_existing_annotations
    value: false
